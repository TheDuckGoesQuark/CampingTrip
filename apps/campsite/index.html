<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- prerender:head -->
    <title>Jordan's Campsite</title>
    <meta
      name="description"
      content="A cosy 3D camping scene — sit inside a tent on a rainy night with a crackling campfire, a wandering cat, and a lantern overhead. Personal website of Jordan Mackie."
    />
    <meta name="author" content="Jordan Mackie" />
    <!-- /prerender:head -->

    <!-- With JavaScript the app redraws the reader's content inside the tent. -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      html.js #reader {
        display: none;
      }
      html:not(.js),
      html:not(.js) body {
        height: auto;
        overflow: auto;
        background: var(--brand-bg, #f4f1e8);
      }
      #reader {
        max-width: 72ch;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      /* Printing gets the reader whether or not the tent is up: it is the page's
         paper form, and what the build prints the CV's PDF from. */
      @media print {
        @page {
          size: A4;
          margin: 16mm;
        }
        body > :not(#reader) {
          display: none;
        }
        html.js #reader {
          display: block;
        }
        #reader {
          max-width: none;
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- prerender:html -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
