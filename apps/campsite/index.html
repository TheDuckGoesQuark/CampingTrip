<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- prerender:head -->
    <title>Jordan's Campsite</title>
    <meta
      name="description"
      content="A cosy 3D camping scene: sit inside a tent on a rainy night with a crackling campfire, a wandering cat, and a lantern overhead. Personal website of Jordan Mackie."
    />
    <meta name="author" content="Jordan Mackie" />
    <!-- /prerender:head -->

    <!-- With JavaScript the app redraws the reader's content inside the tent. -->
    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      html.js #reader {
        display: none;
      }
      html:not(.js),
      html:not(.js) body {
        background: var(--brand-bg, #f4f1e8);
      }
      /* Without the tent the reader is the whole document, and its footer
         belongs on the viewport's floor. Every box between body and reader is a
         column that passes the height on; stop at any one and it stops there. */
      html:not(.js) body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      html:not(.js) body > .jc-brand,
      html:not(.js) #reader {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      /* The inset is published under the same names `Window.Body` uses, so a
         full-bleed banner reaches this document's edges too, and the page is the
         same named container, so a layout that answers to the window's width
         answers to this document's without a second rule for scripts-off. */
      #reader {
        container-type: inline-size;
        container-name: window-page;

        --window-page-inset-block: 2rem;
        --window-page-inset-inline: 1rem;

        /* An explicit basis, because `container-type` makes the inline size
           ignore the contents, and a centred flex item would otherwise take its
           width from them and collapse to nothing. */
        width: 100%;
        max-width: 72ch;
        margin: 0 auto;
        padding: var(--window-page-inset-block) var(--window-page-inset-inline);
      }
      /* Printing gets the reader whether or not the tent is up: it is the page's
         paper form, and what the build prints the CV's PDF from. */
      @media print {
        @page {
          size: A4;
          margin: 16mm;
        }
        /* The reader sits inside the brand provider's wrapper, so keep the
           branch that holds it and drop the rest: the app root, and any portal. */
        body > :not(:has(#reader)) {
          display: none;
        }
        html.js #reader {
          display: block;
        }
        #reader {
          --window-page-inset-block: 0;
          --window-page-inset-inline: 0;

          max-width: none;
          padding: 0;
        }
        /* One paper-coloured page, not the site's layered greens: every box
           around the reader goes white. `:has` carries the id's weight, so this
           outranks a wrapper's own class. */
        html,
        :has(#reader) {
          background: #fff;
        }
      }
    </style>
  </head>
  <body>
    <!-- prerender:html -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
