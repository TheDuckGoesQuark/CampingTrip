name: Storybook

on:
  pull_request:
    paths:
      - "packages/design-system/**"
      - ".github/workflows/storybook.yml"
  push:
    branches: [main]
    paths:
      - "packages/design-system/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build on every PR and upload a downloadable static Storybook so a reviewer
  # can open it locally (download artifact → unzip → open index.html).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter @jordanscamp/ds build-storybook
      - name: Upload static Storybook (download to review)
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/design-system/storybook-static
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/design-system/storybook-static

  # Publish a permanent hosted Storybook on merges to main.
  # Requires GitHub Pages enabled: Settings → Pages → Source = "GitHub Actions".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
