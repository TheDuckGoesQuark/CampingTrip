name: Box

# Runs one of the service scripts under infra/box on the live instance, over
# SSM, after uploading it to the deploy bucket where a rebuilt instance also
# finds it. Each script is idempotent: this is install, upgrade and repair.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Which script under infra/box to run"
        required: true
        type: choice
        default: goatcounter
        options:
          - goatcounter
      admin_email:
        description: "Login address for a dashboard the script creates"
        required: false
        type: string
        default: jmackie97@hotmail.com

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: infra/box
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the script
        run: aws s3 cp "infra/box/${{ inputs.service }}.sh" "s3://${{ vars.S3_DEPLOY_BUCKET }}/_deploy/${{ inputs.service }}.sh"

      - name: Find EC2 instance by tag
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=jordanscamp" "Name=tag:Environment,Values=prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running jordanscamp production instance found"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Run it over SSM
        id: run
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'set -e',
              'aws s3 cp s3://${{ vars.S3_DEPLOY_BUCKET }}/_deploy/${{ inputs.service }}.sh /tmp/${{ inputs.service }}.sh',
              'ADMIN_EMAIL=${{ inputs.admin_email }} BUCKET=${{ vars.S3_DEPLOY_BUCKET }} AWS_REGION=${{ env.AWS_REGION }} bash /tmp/${{ inputs.service }}.sh'
            ]" \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for it
        run: |
          COMMAND_ID="${{ steps.run.outputs.command_id }}"
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          echo "::group::stdout"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text || true
          echo "::endgroup::"
          echo "::group::stderr"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text || true
          echo "::endgroup::"
          [ "$STATUS" = "Success" ] || { echo "::error::${{ inputs.service }}.sh ended with $STATUS"; exit 1; }
