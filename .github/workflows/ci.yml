name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Dependency graph
        run: pnpm check-deps

      - name: Type check
        run: pnpm -r exec tsc -b

      - name: Run tests
        run: pnpm -r test

      # `infra/` is not a workspace package, so `pnpm -r test` never reaches the
      # contact endpoint's validation — which is the whole security surface of a
      # public unauthenticated endpoint. The glob rather than the directory: a
      # bare directory makes node treat `index.mjs` as a test, and that imports
      # the AWS SDK the Lambda runtime provides.
      - name: Contact endpoint tests
        run: node --test "infra/lambda/**/*.test.mjs"

      - name: Build
        run: pnpm -r build

      # A separate step from the build, so a local `pnpm build` needs no browser.
      - name: Cache Chromium for Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm --filter campsite exec playwright install chromium --with-deps

      - name: Render the CV PDF
        run: pnpm --filter campsite build:pdf
