name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  # Deliberately NO `branches` filter here, unlike `push` above.
  #
  # `branches` matches a pull request's BASE, and this repo uses Graphite, where
  # every PR in a stack is based on its parent branch rather than on main. With
  # `branches: [main]` those PRs matched nothing, so an `infra/**` change
  # reviewed as part of a stack got no `fmt -check`, no `validate` and no plan
  # preview — the first Terraform to see it was `apply -auto-approve` after the
  # merge. That is exactly backwards, and it is not theoretical: the five PRs
  # that scoped this account's IAM policies (#66-#70) all skipped this workflow,
  # while #72 — one PR based on main — got the full check.
  #
  # Dropping the filter cannot cause an apply. The `apply` job below is gated on
  # `github.event_name == 'push' && github.ref == 'refs/heads/main'`, and the
  # `push` trigger is still restricted to main, so a feature branch can only ever
  # reach `validate` and the read-only `plan`.
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

env:
  AWS_REGION: eu-west-2
  TF_DIR: infra

jobs:
  # Runs on PRs (incl. forks) and on main. NO AWS credentials and NO backend
  # access — format + validate only. A pull request can therefore never assume
  # the deploy role or run Terraform against real state/creds.
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      - name: Format check
        run: terraform fmt -check
      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

  # Plan preview on PRs, using a READ-ONLY role. Gated to same-repo PRs so a
  # fork never gets credentials, and only runs once AWS_PLAN_ROLE_ARN is set as
  # a repo variable (see the PR description for the one-time setup).
  plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      - name: Terraform Init
        run: terraform init
      - name: Terraform Plan
        id: plan
        run: terraform plan -lock=false -no-color
        continue-on-error: true
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const out = `${{ steps.plan.outputs.stdout }}`;
            // Name the base branch. A stacked PR is based on its parent, but the
            // plan is always computed against LIVE infrastructure — so on PR 3 of
            // a stack it includes the not-yet-merged changes from PRs 1 and 2.
            // Without this line that reads as an unexplained extra diff.
            const base = '${{ github.base_ref }}';
            const scope = base === 'main'
              ? 'against live infrastructure'
              : `against live infrastructure — this PR is stacked on \`${base}\`, so the diff includes that branch's unmerged changes too`;
            const body = '### Terraform Plan (read-only preview)\n'
              + `_${scope}._\n\n`
              + '```\n'
              + (out.length > 60000 ? out.slice(0, 60000) + '\n\n... (truncated)' : out)
              + '\n```\n*Result: ${{ steps.plan.outcome }}*';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Applies infra changes. Only ever on push to main — never on pull_request —
  # so the OIDC role is only assumed from a context the trust policy allows.
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve
