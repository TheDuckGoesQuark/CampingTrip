name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "infra/Caddyfile"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  build-campsite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build campsite
        run: pnpm --filter campsite build

      - name: Upload campsite artifact
        uses: actions/upload-artifact@v6
        with:
          name: campsite
          path: apps/campsite/dist/
          retention-days: 1

  build-photobroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build photobroom
        run: pnpm --filter photobroom build

      - name: Upload photobroom artifact
        uses: actions/upload-artifact@v6
        with:
          name: photobroom
          path: apps/photobroom/dist/
          retention-days: 1

  deploy:
    needs: [build-campsite, build-photobroom]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: infra/Caddyfile
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download campsite artifact
        uses: actions/download-artifact@v7
        with:
          name: campsite
          path: campsite

      - name: Download photobroom artifact
        uses: actions/download-artifact@v7
        with:
          name: photobroom
          path: photobroom

      - name: Upload deploy artifacts to S3
        run: |
          tar czf campsite.tar.gz -C campsite .
          aws s3 cp campsite.tar.gz s3://${{ vars.S3_DEPLOY_BUCKET }}/_deploy/webapp.tar.gz

          tar czf photobroom.tar.gz -C photobroom .
          aws s3 cp photobroom.tar.gz s3://${{ vars.S3_DEPLOY_BUCKET }}/_deploy/photobroom.tar.gz

          aws s3 cp infra/Caddyfile s3://${{ vars.S3_DEPLOY_BUCKET }}/_deploy/Caddyfile

      - name: Find EC2 instance by tag
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=jordanscamp" "Name=tag:Environment,Values=prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running jordanscamp production instance found"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      - name: Deploy via SSM Run Command
        id: deploy
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          S3_BUCKET="${{ vars.S3_DEPLOY_BUCKET }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'set -e',
              'cd /opt/jordanscamp',
              'aws s3 cp s3://$S3_BUCKET/_deploy/webapp.tar.gz /tmp/webapp.tar.gz',
              'mkdir -p /opt/jordanscamp/webapp',
              'rm -rf /opt/jordanscamp/webapp/*',
              'tar xzf /tmp/webapp.tar.gz -C /opt/jordanscamp/webapp/',
              'rm /tmp/webapp.tar.gz',
              'aws s3 cp s3://$S3_BUCKET/_deploy/photobroom.tar.gz /tmp/photobroom.tar.gz',
              'mkdir -p /opt/jordanscamp/photobroom',
              'rm -rf /opt/jordanscamp/photobroom/*',
              'tar xzf /tmp/photobroom.tar.gz -C /opt/jordanscamp/photobroom/',
              'rm /tmp/photobroom.tar.gz',
              'aws s3 cp s3://$S3_BUCKET/_deploy/Caddyfile /etc/caddy/Caddyfile',
              'systemctl restart caddy',
              'sleep 3',
              'systemctl is-active --quiet caddy || exit 1'
            ]" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "Sent SSM command: $COMMAND_ID"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "[$i/60] Status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac

            sleep 10
          done

          echo "::group::Deploy stdout"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "::endgroup::"

          echo "::group::Deploy stderr"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          echo "::endgroup::"

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment failed with status: $STATUS"
            exit 1
          fi

          echo "Deployment successful!"
